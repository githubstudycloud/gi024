server:
  port: 8085

app:
  datasource:
    public:
      name: public-shared
      url: jdbc:h2:mem:public-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
      password:
      driver-class-name: org.h2.Driver
      topology: STANDALONE
      pool:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 3000
      schema-version: v1
    business:
      - name: order-service
        url: jdbc:h2:mem:order-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        username: sa
        password:
        driver-class-name: org.h2.Driver
        topology: STANDALONE
        pool:
          maximum-pool-size: 5
          minimum-idle: 1
          connection-timeout: 3000
        schema-version: v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.multids: INFO
